<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - VividP</title>
    <meta name="description" content="Sign in to your VividP account and access your AI-native developer platform dashboard.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Core Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        :root {
            --color-deep-space: #0A0E1A;
            --color-nebula-blue: #1E3A8A;
            --color-circuit-teal: #0891B2;
            --color-electric-cyan: #06B6D4;
            --color-success: #10B981;
            --color-warning: #F59E0B;
            --color-error: #EF4444;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--color-deep-space);
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }
        
        .circuit-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: radial-gradient(ellipse at center, var(--color-deep-space) 0%, #000000 100%);
        }
        
        .glass {
            background: rgba(30, 58, 138, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(8, 145, 178, 0.2);
        }
        
        .gradient-text {
            background: linear-gradient(135deg, var(--color-nebula-blue), var(--color-electric-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .form-input {
            background: rgba(30, 58, 138, 0.1);
            border: 1px solid rgba(8, 145, 178, 0.3);
            color: #F8FAFC;
            padding: 12px 16px;
            border-radius: 8px;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--color-electric-cyan);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
        }
        
        .form-input::placeholder {
            color: #64748B;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--color-nebula-blue), var(--color-circuit-teal));
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            width: 100%;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(6, 182, 212, 0.4);
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--color-electric-cyan);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 1px solid var(--color-electric-cyan);
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .btn-secondary:hover {
            background: var(--color-electric-cyan);
            color: white;
            transform: translateY(-2px);
        }
        
        .error-message {
            color: var(--color-error);
            font-size: 14px;
            margin-top: 4px;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }
        
        .error-message.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease;
        }
        
        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        .checkbox-custom {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(8, 145, 178, 0.5);
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }
        
        .checkbox-custom:checked {
            background: var(--color-electric-cyan);
            border-color: var(--color-electric-cyan);
        }
        
        .checkbox-custom:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        
        .magic-link-sent {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--color-success);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 16px;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }
        
        .magic-link-sent.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="circuit-bg"></div>
    
    <div class="w-full max-w-md mx-4">
        <!-- Logo and Header -->
        <div class="text-center mb-8 fade-in">
            <div class="flex items-center justify-center space-x-3 mb-6">
                <img src="resources/icons/logo.png" alt="VividP" class="w-10 h-10">
                <span class="text-2xl font-bold gradient-text">VividP</span>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Welcome Back</h1>
            <p class="text-gray-400">Sign in to your AI-native developer platform</p>
        </div>
        
        <!-- Login Form -->
        <div class="glass p-8 rounded-lg fade-in">
            <!-- Magic Link Success Message -->
            <div id="magic-link-sent" class="magic-link-sent">
                <div class="flex items-center space-x-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                    </svg>
                    <span>Magic link sent! Check your email.</span>
                </div>
            </div>
            
            <form id="login-form" class="space-y-6">
                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-2">
                        Email Address *
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-input" 
                        placeholder="john@company.com"
                        required
                    >
                    <div class="error-message" id="email-error"></div>
                </div>
                
                <!-- Password -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-2">
                        Password *
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input pr-12" 
                            placeholder="Enter your password"
                            required
                        >
                        <button 
                            type="button" 
                            id="toggle-password" 
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-cyan-400"
                        >
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                                <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"></path>
                                <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="error-message" id="password-error"></div>
                </div>
                
                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <input 
                            type="checkbox" 
                            id="remember" 
                            name="remember" 
                            class="checkbox-custom"
                        >
                        <label for="remember" class="text-sm text-gray-300">
                            Remember me
                        </label>
                    </div>
                    
                    <button 
                        type="button" 
                        id="forgot-password" 
                        class="text-sm text-cyan-400 hover:text-cyan-300"
                    >
                        Forgot password?
                    </button>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="btn-primary" id="login-btn">
                    <span class="btn-text">Sign In</span>
                    <div class="loading-spinner" id="loading-spinner"></div>
                </button>
            </form>
            
            <!-- Magic Link Option -->
            <div class="mt-6 text-center">
                <button 
                    type="button" 
                    id="magic-link-btn" 
                    class="text-sm text-cyan-400 hover:text-cyan-300"
                >
                    Or sign in with a magic link
                </button>
            </div>
            
            <!-- Divider -->
            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-600"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-transparent text-gray-400">Or continue with</span>
                </div>
            </div>
            
            <!-- Google OAuth -->
            <button class="btn-secondary" id="google-login">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </button>
            
            <!-- Signup Link -->
            <p class="text-center text-gray-400 mt-6">
                Don't have an account? 
                <a href="signup.html" class="text-cyan-400 hover:text-cyan-300 font-medium">
                    Sign up
                </a>
            </p>
        </div>
        
        <!-- Footer -->
        <div class="text-center mt-8 fade-in">
            <p class="text-sm text-gray-500">
                © 2025 VividP. All rights reserved. Built for elite engineering teams.
            </p>
        </div>
    </div>
    
    <script>
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            initAnimations();
            initFormValidation();
            initPasswordToggle();
            initMagicLink();
            initGoogleOAuth();
            initForgotPassword();
        });
        
        // Animations
        function initAnimations() {
            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });
            
            document.querySelectorAll('.fade-in').forEach(el => {
                observer.observe(el);
            });
        }
        
        // Form Validation
        function initFormValidation() {
            const form = document.getElementById('login-form');
            const inputs = form.querySelectorAll('input');
            
            inputs.forEach(input => {
                input.addEventListener('blur', validateField);
                input.addEventListener('input', clearError);
            });
            
            form.addEventListener('submit', handleSubmit);
        }
        
        function validateField(event) {
            const field = event.target;
            const value = field.value.trim();
            const fieldName = field.name;
            
            clearError(event);
            
            let isValid = true;
            let errorMessage = '';
            
            switch (fieldName) {
                case 'email':
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!value) {
                        isValid = false;
                        errorMessage = 'Email is required';
                    } else if (!emailRegex.test(value)) {
                        isValid = false;
                        errorMessage = 'Please enter a valid email address';
                    }
                    break;
                    
                case 'password':
                    if (!value) {
                        isValid = false;
                        errorMessage = 'Password is required';
                    }
                    break;
            }
            
            if (!isValid) {
                showFieldError(fieldName, errorMessage);
                return false;
            }
            
            return true;
        }
        
        function clearError(event) {
            const field = event.target;
            const fieldName = field.name;
            const errorElement = document.getElementById(`${fieldName}-error`);
            
            if (errorElement) {
                errorElement.classList.remove('show');
                errorElement.textContent = '';
            }
            
            field.style.borderColor = 'rgba(8, 145, 178, 0.3)';
        }
        
        function showFieldError(fieldName, message) {
            const errorElement = document.getElementById(`${fieldName}-error`);
            const field = document.getElementById(fieldName);
            
            if (errorElement) {
                errorElement.textContent = message;
                errorElement.classList.add('show');
            }
            
            if (field) {
                field.style.borderColor = 'var(--color-error)';
            }
        }
        
        function handleSubmit(event) {
            event.preventDefault();
            
            const form = event.target;
            const inputs = form.querySelectorAll('input[required]');
            let isFormValid = true;
            
            // Validate all required fields
            inputs.forEach(input => {
                const fieldEvent = { target: input };
                if (!validateField(fieldEvent)) {
                    isFormValid = false;
                }
            });
            
            if (!isFormValid) {
                showNotification('Please correct the errors above', 'error');
                return;
            }
            
            // Show loading state
            const submitBtn = document.getElementById('login-btn');
            const btnText = submitBtn.querySelector('.btn-text');
            const spinner = submitBtn.querySelector('.loading-spinner');
            
            btnText.style.display = 'none';
            spinner.style.display = 'block';
            submitBtn.disabled = true;
            
            // Get form data
            const formData = new FormData(form);
            const email = formData.get('email');
            const password = formData.get('password');
            const remember = formData.get('remember');
            
            // Simulate API call
            setTimeout(() => {
                // Reset button state
                btnText.style.display = 'block';
                spinner.style.display = 'none';
                submitBtn.disabled = false;
                
                // Simulate successful login
                if (email === 'demo@vividp.com' && password === 'demo123') {
                    showNotification('Login successful! Redirecting to dashboard...', 'success');
                    
                    // Store session (in real app, would use secure tokens)
                    if (remember) {
                        localStorage.setItem('vividp_email', email);
                    }
                    
                    // Redirect to dashboard
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 2000);
                } else {
                    showNotification('Invalid email or password', 'error');
                }
            }, 2000);
        }
        
        // Password Toggle
        function initPasswordToggle() {
            const toggleBtn = document.getElementById('toggle-password');
            const passwordField = document.getElementById('password');
            
            toggleBtn.addEventListener('click', function() {
                const isPassword = passwordField.type === 'password';
                passwordField.type = isPassword ? 'text' : 'password';
                
                // Update icon
                toggleBtn.innerHTML = isPassword ? `
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M3.707 2.293a1 1 0 00-1.414 1.414l14 14a1 1 0 001.414-1.414l-1.473-1.473A10.014 10.014 0 0019.542 10C18.268 5.943 14.478 3 10 3a9.958 9.958 0 00-4.512 1.074l-1.78-1.781zm4.261 4.26l1.514 1.515a2.003 2.003 0 012.45 2.45l1.514 1.514a4 4 0 00-5.478-5.478z" clip-rule="evenodd"></path>
                        <path d="M12.454 16.697L9.75 13.992a4 4 0 01-3.742-3.741L2.335 6.578A9.98 9.98 0 00.458 10c1.274 4.057 5.065 7 9.542 7 .847 0 1.669-.105 2.454-.303z"></path>
                    </svg>
                ` : `
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 12a2 2 0 100-4 2 2 0 000 4z"></path>
                        <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd"></path>
                    </svg>
                `;
            });
        }
        
        // Magic Link Authentication
        function initMagicLink() {
            const magicLinkBtn = document.getElementById('magic-link-btn');
            
            magicLinkBtn.addEventListener('click', function() {
                const email = document.getElementById('email').value.trim();
                
                if (!email) {
                    showFieldError('email', 'Please enter your email address');
                    return;
                }
                
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    showFieldError('email', 'Please enter a valid email address');
                    return;
                }
                
                // Show loading state
                const originalText = magicLinkBtn.textContent;
                magicLinkBtn.textContent = 'Sending magic link...';
                magicLinkBtn.disabled = true;
                
                // Simulate sending magic link
                setTimeout(() => {
                    magicLinkBtn.textContent = originalText;
                    magicLinkBtn.disabled = false;
                    
                    // Show success message
                    const successMessage = document.getElementById('magic-link-sent');
                    successMessage.classList.add('show');
                    
                    showNotification('Magic link sent! Check your email inbox.', 'success');
                    
                    // Hide message after 10 seconds
                    setTimeout(() => {
                        successMessage.classList.remove('show');
                    }, 10000);
                }, 2000);
            });
        }
        
        // Google OAuth
        function initGoogleOAuth() {
            const googleBtn = document.getElementById('google-login');
            
            googleBtn.addEventListener('click', function() {
                // Show loading state
                const originalHTML = googleBtn.innerHTML;
                googleBtn.innerHTML = `
                    <div class="loading-spinner" style="display: block; border-top-color: currentColor;"></div>
                    Connecting...
                `;
                googleBtn.disabled = true;
                
                // Simulate OAuth flow
                setTimeout(() => {
                    googleBtn.innerHTML = originalHTML;
                    googleBtn.disabled = false;
                    
                    showNotification('Google OAuth integration would be implemented here', 'info');
                }, 2000);
            });
        }
        
        // Forgot Password
        function initForgotPassword() {
            const forgotPasswordBtn = document.getElementById('forgot-password');
            
            forgotPasswordBtn.addEventListener('click', function() {
                const email = document.getElementById('email').value.trim();
                
                if (!email) {
                    showFieldError('email', 'Please enter your email address first');
                    return;
                }
                
                // Show forgot password modal
                showForgotPasswordModal(email);
            });
        }
        
        function showForgotPasswordModal(email) {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
            modal.innerHTML = `
                <div class="glass p-8 rounded-lg max-w-md w-full mx-4">
                    <h3 class="text-2xl font-bold text-white mb-4">Reset Password</h3>
                    <p class="text-gray-300 mb-6">
                        We'll send a password reset link to <strong>${email}</strong>
                    </p>
                    <div class="space-y-4">
                        <div class="bg-blue-900/20 border border-blue-500/30 rounded-lg p-4">
                            <div class="flex items-start space-x-3">
                                <svg class="w-5 h-5 text-blue-400 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
                                </svg>
                                <div>
                                    <p class="text-sm text-blue-300">
                                        Check your spam folder if you don't see the email within a few minutes.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex space-x-4 mt-8">
                        <button class="btn-primary flex-1" onclick="sendPasswordReset('${email}')">
                            Send Reset Link
                        </button>
                        <button class="btn-secondary flex-1" onclick="closeModal(this)">
                            Cancel
                        </button>
                    </div>
                </div>
            `;
            
            // Close modal when clicking outside
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    closeModal(modal.querySelector('.btn-secondary'));
                }
            });
            
            document.body.appendChild(modal);
            
            // Animate in
            anime({
                targets: modal,
                opacity: [0, 1],
                duration: 300,
                easing: 'easeOutQuad'
            });
        }
        
        function sendPasswordReset(email) {
            showNotification('Password reset link sent! Check your email.', 'success');
            closeModal(document.querySelector('.btn-secondary'));
        }
        
        function closeModal(button) {
            const modal = button.closest('.fixed');
            anime({
                targets: modal,
                opacity: [1, 0],
                duration: 300,
                easing: 'easeOutQuad',
                complete: function() {
                    modal.remove();
                }
            });
        }
        
        // Notification System
        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 z-50 p-4 rounded-lg glass max-w-sm transform translate-x-full transition-transform duration-300`;
            
            const colors = {
                success: 'border-green-400 text-green-400',
                error: 'border-red-400 text-red-400',
                warning: 'border-yellow-400 text-yellow-400',
                info: 'border-cyan-400 text-cyan-400'
            };
            
            notification.classList.add(colors[type] || colors.info);
            notification.innerHTML = `
                <div class="flex items-center space-x-3">
                    <div class="flex-shrink-0">
                        ${getNotificationIcon(type)}
                    </div>
                    <div class="flex-1">
                        <p class="text-sm font-medium">${message}</p>
                    </div>
                    <button class="flex-shrink-0 text-gray-400 hover:text-white" onclick="this.parentElement.parentElement.remove()">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path>
                        </svg>
                    </button>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            // Animate in
            setTimeout(() => {
                notification.style.transform = 'translateX(0)';
            }, 100);
            
            // Auto remove after 5 seconds
            setTimeout(() => {
                notification.style.transform = 'translateX(full)';
                setTimeout(() => {
                    if (notification.parentElement) {
                        notification.remove();
                    }
                }, 300);
            }, 5000);
        }
